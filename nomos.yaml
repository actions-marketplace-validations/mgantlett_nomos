# yaml-language-server: $schema=./nomos.schema.json
project: nomos
default_branch: main
governance:
    boundary:
        enforce: true
        lock_dependencies: true
        prohibited_packages:
            - "pkg/sovereign"
            - "substrate/membrane"
            - "substrate/cockpit-ui"
        prohibited_commands:
            - "code"
            - "cockpit"
            - "outreach"
            - "soma"
            - "ship"
            - "broadcast"
            - "vector"
            - "swarm"
            - "portal"
            - "cyber"
            - "daemon"
            - "pm2"
    quality_gates:
        forbidden_literals:
            - '".nomos/'
            - '".agent/'
            - '".agents/'
            - '".gemini/'
            - '"/home/'
            - '"/Users/'
            - '"/var/home/'
            - '"/workstations/'
        strict_mode: true
        intent_twin_mode: feat
        verify_scope: diff
        tdd_mode: strict
        coverage_mode: live
        exclude: []
        intent_source_roots:
            - "intent"
        substrate_source_roots:
            - "substrate"
        architecture_boundaries:
            - name: "core-purity"
              from: "substrate/src/nomos/core/**"
              forbid_imports:
                  - "substrate/src/nomos/modules/**"
                  - "substrate/cli/**"
            - name: "core-no-cmd"
              from: "substrate/src/nomos/core/**"
              forbid_imports:
                  - "substrate/cmd/**"
            - name: "modules-independence"
              from: "substrate/src/nomos/modules/**"
              forbid_imports:
                  - "substrate/cli/**"
            - name: "modules-no-cmd"
              from: "substrate/src/nomos/modules/**"
              forbid_imports:
                  - "substrate/cmd/**"
            - name: "pure-leaf-treesitter"
              from: "substrate/src/nomos/modules/verify/treesitter/**"
              forbid_imports:
                  - "substrate/**"
            - name: "pure-leaf-ncte"
              from: "substrate/src/nomos/modules/ncte/**"
              forbid_imports:
                  - "substrate/**"
            - name: "domain-task-isolation"
              from: "substrate/src/nomos/modules/task/**"
              forbid_imports:
                  - "substrate/src/nomos/modules/verify/**"
                  - "substrate/src/nomos/modules/session/**"
                  - "substrate/src/nomos/modules/handshake/**"
            - name: "domain-mem-isolation"
              from: "substrate/src/nomos/modules/mem/**"
              forbid_imports:
                  - "substrate/src/nomos/modules/verify/**"
                  - "substrate/src/nomos/modules/session/**"
                  - "substrate/src/nomos/modules/handshake/**"
            - name: "domain-mtpo-isolation"
              from: "substrate/src/nomos/modules/mtpo/**"
              forbid_imports:
                  - "substrate/src/nomos/modules/verify/**"
                  - "substrate/src/nomos/modules/session/**"
                  - "substrate/src/nomos/modules/handshake/**"
            - name: "domain-telemetry-isolation"
              from: "substrate/src/nomos/modules/telemetry/**"
              forbid_imports:
                  - "substrate/src/nomos/modules/verify/**"
                  - "substrate/src/nomos/modules/session/**"
                  - "substrate/src/nomos/modules/handshake/**"
        contracts:
            contracts:
                enabled: true
                spec_roots:
                    - "intent/intent.md"
                    - "intent/architecture/specs"
                schema_files:
                    - "nomos.schema.json"
                backend_roots:
                    - "substrate"
                strict_types: true
                verify_obligations: true
                fail_on_stale_obligations: true
        thresholds:
            max_cognitive_debt_score: 45
            max_cyclomatic_complexity: 14
            max_file_loc: 400
            max_func_loc: 55
            min_comment_density_pct: 90
            min_test_coverage_pct: 65
            min_clone_lines: 14
            max_func_params: 7
            max_magic_string_duplication: 8
            max_package_files: 30
